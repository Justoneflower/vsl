<!--
  INTEGRATION SNIPPET
  ====================
  Paste this <script> block into your main site's HTML, right before
  the closing </body> tag (e.g. after your existing <script> block).

  What it does:
  On every page load, it fetches the current Date / Time / Duration /
  Language from your backend and fills in the hero info cards — so every
  visitor sees whatever the client last saved in the admin panel.

  It also requires adding 4 ids to your existing hero-info-grid HTML.
  Find these lines in your main site and add the id="..." attributes
  exactly as shown:

    <h4 id="dateValue">25 July 2026</h4>
    <h4 id="timeValue">9:30 AM – 12:30 PM</h4>
    <h4 id="durationValue">3 Hours</h4>
    <h4 id="languageValue">English & Hindi</h4>

  The text already in the HTML (e.g. "25 July 2026") stays as a fallback —
  if the backend is unreachable for any reason, visitors still see sensible
  values instead of a blank card.
-->

<script>
(function() {
  // Must match the API_BASE used in admin-login.html / admin-panel.html
  const API_BASE = 'https://YOUR-BACKEND-URL.example.com';

  fetch(`${API_BASE}/api/content`)
    .then(res => {
      if (!res.ok) throw new Error('Bad response from admin server');
      return res.json();
    })
    .then(data => {
      const dateEl = document.getElementById('dateValue');
      const timeEl = document.getElementById('timeValue');
      const durationEl = document.getElementById('durationValue');
      const languageEl = document.getElementById('languageValue');
      if (dateEl && data.date) dateEl.textContent = data.date;
      if (timeEl && data.time) timeEl.textContent = data.time;
      if (durationEl && data.duration) durationEl.textContent = data.duration;
      if (languageEl && data.language) languageEl.textContent = data.language;
    })
    .catch(err => {
      // Silent fallback: the hardcoded HTML values stay visible.
      console.warn('Could not load live event details, showing defaults:', err);
    });
})();
</script>
